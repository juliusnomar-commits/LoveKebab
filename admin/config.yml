# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: juliusnomar-commits/LoveKebab
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2f24c3b9-9cbe-449b-8696-8d72b9d0516d/pkce
  auth_token_endpoint: /sites/2f24c3b9-9cbe-449b-8696-8d72b9d0516d/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://love-kebab-tau.vercel.app

# Where uploaded photos are stored in the repo / served on the live site
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Startseite"
    files:
      - name: "homepage"
        label: "Startseite – Texte & Fotos"
        file: "content/site.json"
        fields:
          - label: "Hero (großer Bereich oben)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Kicker-Zeile", name: "kicker", widget: "string" }
              - { label: "Überschrift – Wort 1", name: "word0", widget: "string" }
              - { label: "Überschrift – Wort 2", name: "word1", widget: "string" }
              - { label: "Überschrift – Wort 3 (Akzentfarbe)", name: "word2", widget: "string" }
              - { label: "„100% frisches Fleisch“-Text", name: "trust1", widget: "string" }
          - label: "Standort"
            name: "place"
            widget: "object"
            fields:
              - { label: "Ortsname", name: "name", widget: "string" }
          - label: "Unsere Geschichte"
            name: "story"
            widget: "object"
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift (mit <br> für Zeilenumbruch)", name: "title", widget: "string" }
              - { label: "Text", name: "body1", widget: "text" }
              - { label: "Statistik 1 Beschriftung (über „7/7“)", name: "stat1", widget: "string" }
              - { label: "Statistik 2 Beschriftung (über „100%“)", name: "stat2", widget: "string" }
              - { label: "Statistik 3 Beschriftung (über „10+“)", name: "stat3", widget: "string" }
          - label: "Menü-Vorschau (4 Karten auf der Startseite)"
            name: "menu"
            widget: "object"
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift (mit <br> für Zeilenumbruch)", name: "title", widget: "string" }
              - { label: "Name: Wings", name: "wingsName", widget: "string" }
              - { label: "Beschreibung: Wings", name: "descWings", widget: "string" }
              - { label: "Name: Parmesan Fries", name: "parmFriesName", widget: "string" }
              - { label: "Beschreibung: Parmesan Fries", name: "descParmFries", widget: "string" }
              - { label: "Name: Döner Kebab", name: "doenerName", widget: "string" }
              - { label: "Beschreibung: Döner Kebab", name: "descDoener", widget: "string" }
              - { label: "Name: Dürüm", name: "duerumName", widget: "string" }
              - { label: "Beschreibung: Dürüm", name: "descDurum", widget: "string" }
              - { label: "Button-Text „Vollständige Speisekarte“", name: "fullMenuCta", widget: "string" }
          - label: "Warum Love Kebab"
            name: "values"
            widget: "object"
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift (mit <br> für Zeilenumbruch)", name: "title", widget: "string" }
              - { label: "Titel: Hausgemachte Soßen", name: "sauceTitle", widget: "string" }
              - { label: "Text: Frisches Fleisch", name: "meatDesc", widget: "string" }
              - { label: "Text: Hausgemachte Soßen", name: "sauceDesc", widget: "string" }
              - { label: "Titel: Mit Liebe gemacht", name: "loveTitle", widget: "string" }
              - { label: "Text: Mit Liebe gemacht", name: "loveDesc", widget: "string" }
          - label: "Galerie „Ein Blick in unsere Küche“"
            name: "process"
            widget: "object"
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "title", widget: "string" }
              - { label: "Schritt 1 – Label", name: "step1", widget: "string" }
              - { label: "Schritt 1 – Titel", name: "title1", widget: "string" }
              - { label: "Schritt 1 – Text", name: "desc1", widget: "string" }
              - { label: "Schritt 1 – Foto-Bildunterschrift", name: "photo1", widget: "string" }
              - { label: "Schritt 2 – Label", name: "step2", widget: "string" }
              - { label: "Schritt 2 – Titel", name: "title2", widget: "string" }
              - { label: "Schritt 2 – Text", name: "desc2", widget: "string" }
              - { label: "Schritt 2 – Foto-Bildunterschrift", name: "photo2", widget: "string" }
              - { label: "Schritt 3 – Label", name: "step3", widget: "string" }
              - { label: "Schritt 3 – Titel", name: "title3", widget: "string" }
              - { label: "Schritt 3 – Text", name: "desc3", widget: "string" }
              - { label: "Schritt 3 – Foto-Bildunterschrift", name: "photo3", widget: "string" }
              - { label: "Schritt 4 – Label", name: "step4", widget: "string" }
              - { label: "Schritt 4 – Titel", name: "title4", widget: "string" }
              - { label: "Schritt 4 – Text", name: "desc4", widget: "string" }
              - { label: "Schritt 4 – Foto-Bildunterschrift", name: "photo4", widget: "string" }
          - label: "Kontakt & Öffnungszeiten"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift (mit <br> für Zeilenumbruch)", name: "title", widget: "string" }
              - { label: "WhatsApp-Button Text", name: "whatsapp", widget: "string" }
              - { label: "Öffnungszeiten-Titel", name: "hoursTitle", widget: "string" }
              - { label: "Öffnungszeiten-Hinweis (klein, unten)", name: "hoursNote", widget: "string" }
              - { label: "Adresse – Zeile 1 (Straße)", name: "addressLine1", widget: "string" }
              - { label: "Adresse – Zeile 2 (PLZ/Ort)", name: "addressLine2", widget: "string" }
              - { label: "Telefonnummer (Anzeige-Text)", name: "phoneDisplay", widget: "string" }
          - label: "Öffnungszeiten – Uhrzeiten"
            name: "hours"
            widget: "object"
            fields:
              - { label: "Montag", name: "mon", widget: "string" }
              - { label: "Dienstag", name: "tue", widget: "string" }
              - { label: "Mittwoch", name: "wed", widget: "string" }
              - { label: "Donnerstag", name: "thu", widget: "string" }
              - { label: "Freitag", name: "fri", widget: "string" }
              - { label: "Samstag", name: "sat", widget: "string" }
              - { label: "Sonntag (Text statt Uhrzeit)", name: "closed", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Rechtlicher Text unter dem Logo", name: "legal", widget: "string" }
              - { label: "Copyright-Text", name: "rights", widget: "string" }
          - label: "SEO / Google-Vorschau"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Seitentitel", name: "title", widget: "string" }
              - { label: "Meta-Beschreibung", name: "description", widget: "text" }
          - label: "Fotos"
            name: "images"
            widget: "object"
            fields:
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Hero-Foto (großes Startbild)", name: "hero", widget: "image" }
              - { label: "Laden-/Küchenfoto (bei „Unsere Geschichte“)", name: "storyPhoto", widget: "image" }
              - { label: "Foto: Wings", name: "wingsPhoto", widget: "image" }
              - { label: "Foto: Parmesan Fries", name: "parmFriesPhoto", widget: "image" }
              - { label: "Foto: Döner Kebab", name: "doenerPhoto", widget: "image" }
              - { label: "Foto: Dürüm", name: "duerumPhoto", widget: "image" }

  - name: "menu"
    label: "Speisekarte"
    files:
      - name: "fullmenu"
        label: "Vollständige Speisekarte"
        file: "content/menu.json"
        fields:
          - label: "Kategorien"
            name: "categories"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Interne ID – bitte nicht ändern!", name: "id", widget: "string", hint: "Verknüpft diese Kategorie mit dem passenden Bereich der Speisekarte-Seite. Wird dieser Wert geändert, verschwindet die Kategorie von der Seite." }
              - { label: "Kicker über der Überschrift", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "title", widget: "string" }
              - { label: "Label in der Sprungnavigation oben", name: "jumpLabel", widget: "string" }
              - { label: "Layout – bitte nicht ändern!", name: "layout", widget: "select", options: ["grid", "list"], hint: "„grid“ = Karten mit Foto (z. B. Pizza). „list“ = einfache Preisliste ohne Foto (z. B. Getränke)." }
              - label: "Gerichte / Positionen"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Beschreibung", name: "desc", widget: "string", required: false, hint: "Nur bei Karten-Layout sichtbar." }
                  - { label: "Preis", name: "price", widget: "string", required: false, hint: "z. B. 8,00 €. Leer lassen, wenn unten „Bitte im Laden fragen“ aktiviert ist." }
                  - { label: "Foto", name: "image", widget: "image", required: false, hint: "Nur bei Karten-Layout sichtbar." }
                  - { label: "Alt-Text (Bildbeschreibung für Screenreader)", name: "imageAlt", widget: "string", required: false }
                  - { label: "„Bitte im Laden fragen“ statt Preis anzeigen", name: "askInStore", widget: "boolean", required: false, default: false }
